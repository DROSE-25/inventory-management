# src/main/resources/application-test.yml
# H2 in-memory DB для тестів — ізольованість та швидкість
 
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
 
  jpa:
    hibernate:
      ddl-auto: create-drop      # H2: створити при старті, видалити після тесту
 
  flyway:
    enabled: false               # Flyway не потрібний для H2 — JPA сам створює
 
logging:
  level:
    com.inventory: WARN          # мінімум логів у тестах

