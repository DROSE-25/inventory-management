# src/main/resources/application-dev.yml
# Локальна розробка — детальні логи, hot reload

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/inventory_db}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:inventory_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:inventory_pass}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 20000

  jpa:
    show-sql: true

  thymeleaf:
    cache: false

server:
  port: 8080

logging:
  level:
    com.inventory: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE