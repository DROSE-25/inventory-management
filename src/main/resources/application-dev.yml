# src/main/resources/application-dev.yml
# Локальна розробка — детальні логи, hot reload
 
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/inventory_db
    username: ${DB_USERNAME:inventory_user}
    password: ${DB_PASSWORD:inventory_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 20000
 
  jpa:
    show-sql: true               # показувати SQL у dev
 
  thymeleaf:
    cache: false
 
server:
  port: 8080
 
logging:
  level:
    com.inventory: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE  # показує параметри запитів
